name: Deploy rig-web

# PERMANENT REDIRECT STUB DEPLOY — do not delete this workflow.
#
# rig-web (the SPA) moved to the `rig` repo and is now served at
# https://toon-protocol.github.io/rig/ (toon-client#443, rig ADR-0001,
# companion issue toon-protocol/rig#20). This repo no longer contains the
# SPA's source (packages/rig-web is gone). But `rig push` has already
# written https://toon-protocol.github.io/toon-client into NIP-34 rig
# pointers uploaded to Arweave as the no-JS fallback URL — permanently and
# immutably (DEFAULT_RIG_WEB_URL in the `rig` repo's
# packages/rig/src/rig-pointer.ts). That URL must never 404, so this
# workflow keeps publishing to the same Pages site, just with a tiny static
# page (.github/rig-web-redirect/index.html) that redirects client-side to
# /rig/, preserving the URL fragment (rig-web routes and relay hints live
# entirely in the fragment, which a server-side redirect can't see).
#
# Keep the workflow name and Pages wiring unchanged so the deploy keeps
# succeeding under the same GitHub Pages site/URL.

on:
  push:
    branches: [main]
    paths:
      - '.github/rig-web-redirect/**'
      - '.github/workflows/deploy-rig-web.yml'
  workflow_dispatch:

# Least privilege for the Pages deployment (GITHUB_TOKEN OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/rig-web-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
