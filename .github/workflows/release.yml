name: Release

# Publishes @toon-protocol/core and @toon-protocol/sdk to npm via changesets.
# Auth comes from the org-level NPM_TOKEN secret (no local `npm login`).
# changesets rewrites `workspace:*` -> the real version at publish time.
#
# The Release PR is opened with the org GitHub App token (APP_ID/APP_PRIVATE_KEY),
# NOT the default GITHUB_TOKEN: the org forbids GitHub Actions from creating PRs
# ("GitHub Actions is not permitted to create or approve pull requests"), and that
# policy can't be overridden per-repo. An App is a distinct actor, so its PRs are
# exempt. If the App isn't installed the token step is skipped and we fall back to
# GITHUB_TOKEN (publish still works; only the Release-PR step would be blocked).

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true # App not installed -> fall back to GITHUB_TOKEN
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The App token, NOT the default GITHUB_TOKEN. changesets/action
          # pushes `changeset-release/main` with the git credentials checkout
          # persists — and a push made by GITHUB_TOKEN triggers no workflows,
          # so the Version Packages PR sat permanently BLOCKED on the required
          # `build` check that never ran (while the PR itself could still be
          # CREATED, because PR creation uses the env token below, which was
          # already the App's). With the App as the push author, the PR's
          # pull_request events fire CI like any human push would.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The artifact users actually install is this Claude Desktop extension
      # (.mcpb), not the npm package — @toon-protocol/client-mcp stopped
      # publishing to npm (#549: private + changesets `ignore`), so
      # `publishedPackages` never lists it and the old gate on
      # `contains(publishedPackages, '@toon-protocol/client-mcp')` can never
      # fire again (issue #536's packaging gotcha, otherwise permanent: every
      # future client-mcp fix would ship to nobody). build-mcpb.mjs packs the
      # tarball straight from the `dist/` this job just built, not from the
      # npm registry, so it doesn't need client-mcp's own (now-frozen) npm
      # version to move — only that *something* published this run, so this
      # doesn't also fire on a plain Release-PR-update push.
      - name: Build & attach Desktop extension (.mcpb)
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/client-mcp/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Packaging .mcpb for client-mcp@$VERSION (sha $SHORT_SHA)"
          OUT="toon-$VERSION.mcpb"
          # dist/ is already built by the `pnpm -r build` step above.
          node packages/client-mcp/scripts/build-mcpb.mjs --out "$OUT"

          # No per-version GitHub Release to attach to anymore (changesets
          # never creates one for an ignored package) — maintain only the
          # stable, version-less download URL by re-pointing the
          # `mcpb-latest` release at this build:
          #   …/releases/download/mcpb-latest/toon.mcpb
          # `--latest=false` so it never steals the repo's "Latest" badge from
          # the real version releases.
          cp "$OUT" toon.mcpb
          gh release delete mcpb-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mcpb-latest toon.mcpb \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "TOON Desktop extension — latest" \
            --notes "Always the newest client-mcp .mcpb (currently $VERSION, built from $SHORT_SHA). Stable download: https://github.com/${GITHUB_REPOSITORY}/releases/download/mcpb-latest/toon.mcpb — install via Claude Desktop → Settings → Extensions → Advanced → Install Extension."

      - name: Upload .mcpb as workflow artifact
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toon-mcpb
          path: toon-*.mcpb
          if-no-files-found: warn
