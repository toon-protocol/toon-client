name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    # Only meaningful on PRs; push-to-main runs after merge so skip there.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require changeset when a released package changes
        run: |
          # "Released" here means "changesets versions it and writes its
          # CHANGELOG", which is NOT the same as "publishes to npm". This repo
          # ships exactly one package, so the list has exactly one entry.
          NEEDS_CHANGESET="packages/client"
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          needs_changeset=false
          for pkg in $NEEDS_CHANGESET; do
            if echo "$changed" | grep -q "^${pkg}/"; then
              needs_changeset=true
              break
            fi
          done
          if [ "$needs_changeset" = "true" ]; then
            new_changesets=$(echo "$changed" | grep -c "^\.changeset/.*\.md$" || true)
            if [ "$new_changesets" -eq 0 ]; then
              echo "::error::This PR modifies a released package but includes no changeset."
              echo "Run 'pnpm changeset' and commit the generated .changeset/*.md file."
              exit 1
            fi
          fi

      # The step above asserts only that a `.changeset/*.md` FILE EXISTS. It
      # never parses one, so a changeset that is well-formed YAML but an invalid
      # RELEASE PLAN sailed through it — and `release.yml`, which runs after
      # merge where its failure gates nothing, was the first thing in the repo to
      # read the file. That is toon-client#611: a changeset named both
      # `@toon-protocol/client` and a package that was listed in `ignore`,
      # changesets refuses a changeset that mixes ignored and non-ignored
      # packages, and `release.yml` was red on EVERY push to main for a day — so
      # no correctness fix in `@toon-protocol/client` could reach a consumer.
      #
      # WHY `changeset version` AND NOT `changeset status`. Fidelity: this is the
      # byte-identical command `release.yml`'s `changesets/action` runs as its
      # `version:` input, so "this check is green" means "the release will get
      # past versioning", with no second implementation to drift. `status` is
      # read-only and prettier, but it additionally resolves `baseBranch` through
      # git and errors when it decides packages changed with no changeset —
      # duplicating the step above with a different definition of "changed" and a
      # new way to misfire on a PR that touches only an ignored package.
      #
      # Mutating the tree is free here: this job is a throwaway checkout that
      # commits, pushes and publishes nothing, and it has no later steps. The
      # bumps it writes are printed rather than discarded, because "which
      # packages would this release move" is the useful half of the output.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert the changesets form a valid release plan
        run: |
          set -euo pipefail
          pnpm changeset version
          echo "--- the release plan this PR would produce ---"
          git --no-pager diff --stat
          git --no-pager diff -- '**/package.json' | grep -E '^[+-]  "version"' || true
          echo "✅ changeset version succeeds — release.yml can get past versioning"

      # A changeset that `changeset version` LEAVES BEHIND is the silent half of
      # the same family as #611: it is not an error, so the step above stays
      # green, and the file simply accumulates in `.changeset/` release after
      # release while its description reaches no changelog at all. That is
      # toon-client#614 — six changesets naming only an `ignore`d package sat
      # unconsumed for ten days, and that package's CHANGELOG was frozen the
      # whole time.
      #
      # `changeset version` consumes every changeset it can act on, so after the
      # step above the only `.md` files left in `.changeset/` are ones changesets
      # could not act on: a changeset naming ONLY packages in `ignore`, or naming
      # a package that no longer exists under that name. Both are files whose
      # author believed they had written a release note and had not.
      #
      # Note this deliberately does NOT flag an EMPTY changeset (`---\n---`).
      # Those are consumed and deleted like any other, and this repo uses them on
      # purpose as "CI-only, nothing to release" markers (#612's own changeset is
      # one). The defect is a file that survives, not a file with no bumps.
      #
      # Runs in the same job so it reads the tree the step above just mutated.
      - name: Assert no changeset is left unconsumed
        run: |
          set -euo pipefail
          leftover=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -printf '%f\n' | sort)
          if [ -n "$leftover" ]; then
            echo "::error::changeset version left these changesets unconsumed — they will never reach a CHANGELOG:"
            echo "$leftover" | sed 's/^/  - /'
            echo "Each names only packages in .changeset/config.json's \`ignore\`, or a package name that does not exist."
            echo "Fix by naming a package changesets versions, or by removing the file if there is genuinely nothing to release."
            exit 1
          fi
          echo "✅ every changeset was consumed — none can accumulate unread"

  build:
    runs-on: ubuntu-latest
    steps:
      # First step: the gate no-regression guard (below) measures wall-clock
      # against the frozen `.sandcastle/gate-baseline.json`, which was
      # captured as this job's TOTAL duration (checkout through test) — so
      # timing must start here, before checkout, to stay comparable.
      - name: Record gate start time
        id: gate-start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # JSON output (not human-readable "stylish") so the gate guard can
      # parse exact error/warning counts. continue-on-error: the frozen
      # baseline debt (16 errors / 718 warnings) shouldn't block the job by
      # itself — the guard step below is the real pass/fail authority.
      - name: Lint
        run: npx eslint . -f json -o /tmp/eslint-report.json
        continue-on-error: true

      - run: pnpm -r build

      # Typecheck previously had NO CI step at all (soft-gated in agent
      # instructions only) — a genuine false-PASS hole (toon-client#433).
      # continue-on-error for the same reason as lint: the 75 frozen
      # pre-existing errors (#423) shouldn't block the job; the guard does.
      - name: Typecheck
        run: pnpm -r --no-bail run typecheck 2>&1 | tee /tmp/typecheck.log
        continue-on-error: true

      - run: pnpm -r test --if-present

      # `pnpm -r` EXCLUDES the workspace root, and the root `vitest.config.ts` is
      # the only config whose `include` covers `.sandcastle/**/*.test.ts` and
      # `.github/rig-web-redirect/**/*.test.ts`. So the step above has never run
      # them: the gate guard's OWN tests did not run on the gate they guard
      # (toon-client#607). Scoped by path rather than a bare `vitest run`, which
      # would re-run every package's unit suite through the root config.
      #
      # Deliberately BEFORE the guard step, so a broken `gate-guard.ts` fails
      # here rather than being trusted to judge itself. 26 tests, ~0.2s of
      # vitest plus node startup — inside the timed window, and small against the
      # 185s baseline's 20% tolerance.
      - name: Test the workspace root (the files `pnpm -r` cannot see)
        run: npx vitest run .sandcastle/ .github/rig-web-redirect/

      - name: Gate no-regression guard
        run: |
          END=$(date +%s)
          WALL_CLOCK=$((END - ${{ steps.gate-start.outputs.start }}))
          RUNNER_MINUTES=$(awk "BEGIN { printf \"%.4f\", $WALL_CLOCK / 60 }")
          echo "Gate wall-clock: ${WALL_CLOCK}s (${RUNNER_MINUTES} runner-minutes)"
          npx tsx .sandcastle/gate-guard.ts \
            --eslint-json=/tmp/eslint-report.json \
            --typecheck-log=/tmp/typecheck.log \
            --wall-clock-seconds="$WALL_CLOCK" \
            --runner-minutes="$RUNNER_MINUTES"

  # Deliberately NOT `continue-on-error`. This is the only job that installs
  # with `--no-frozen-lockfile`, so it is the only place dependency drift is
  # visible at all — every other job is pinned by the lockfile and stays green
  # through an upstream breaking change.
  #
  # It used to carry `continue-on-error: true`, which made it useless as a
  # signal: a job-level `continue-on-error` still reports the job's own
  # conclusion as `failure`, but makes `needs.devbox-validate.result` evaluate
  # to `success`, so the `DEVBOX_RESULT` check in `ci-ok` below was dead code.
  # The job then sat red on every PR for a full day after
  # `@toon-protocol/sdk@3.1.8` landed while six PRs merged past it, and nobody
  # could tell the standing failure from a real regression.
  #
  # The trade-off is real and accepted: because this job re-resolves ranges,
  # an upstream publish can turn it red with no change to this repo, wedging
  # unrelated PRs until someone adapts the code and moves the lockfile. That
  # is the intended cost — `ci-ok` already listed this job as gating, and a
  # wedge that gets fixed in hours beats drift that hides for weeks.
  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Assert tool versions
        run: |
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.'
          pnpm --version | grep -E '^8\.15\.9$'
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build
        run: devbox run -- bash -c "pnpm install --no-frozen-lockfile && pnpm build"

  # ---------------------------------------------------------------------------
  # The receive-side Solana settlement proof (#605), actually executing.
  #
  # #605 built the submitter and proved it works — it drives the real client
  # pipeline (ingestReceivedClaims -> buildSwapSettlements ->
  # submitSolanaSettlement) against a real `solana-test-validator` running the
  # real vendored payment-channel program at a real channel PDA, and reads the
  # account back to watch `nonce_a`/`transferred_amount_a` move. But it proved
  # it on a developer's machine: CI never ran it, because the suite skips when
  # `solana-test-validator` is absent and no CI job ever installed one. This job
  # is what makes it run.
  #
  # WHY UNCONDITIONAL, where toon#217 made the equivalent proof conditional.
  # That decision was driven by toon's frozen summed-runner-second ceiling,
  # which measures every job of the run; folding a ~90s job in would have blown
  # it. This repo's ceiling is not shaped like that: `.sandcastle/gate-baseline.json`
  # scopes both `speed` and `performance` to the `build` job's OWN wall clock,
  # measured inside that job between "Record gate start time" and the guard step
  # ("not the separate devbox-validate job, which is an unrelated
  # environment-consistency check"). A new sibling job is therefore invisible to
  # the guard, and needs no re-baselining. With the cost argument gone, three
  # things favour running it every time:
  #
  #  * A conditional design would cost about what it saves. The decision has to
  #    be code, not a `paths:` filter (a filter cannot gate a JOB and cannot fail
  #    safe), and it cannot be a step in `build`: recent `build` runs measure
  #    171-206s against a frozen 185s baseline at 20% tolerance, i.e. a 222s
  #    ceiling with ~8% headroom, so adding steps to the timed window is the one
  #    change with real risk here. That pushes the decision into its own job,
  #    which then pays checkout + install on EVERY PR to skip a ~90s job on most
  #    of them — while adding a skipped-reads-as-pass hazard that only exists
  #    because the job became conditional.
  #  * Running every time keeps the Solana CLI cache warm. A conditional job
  #    touches its cache rarely, and GitHub evicts entries unused for 7 days, so
  #    conditionality would make a cold `release.anza.xyz` download MORE likely
  #    on exactly the PRs that need the proof — putting a third-party host in
  #    the critical path of the settlement changes it is there to guard.
  #  * It catches more. Redemption can break from a dependency bump, a
  #    ReceivedClaimStore refactor, or an `@toon-protocol/core` digest change —
  #    a change set that no honest surface list would have flagged.
  #
  # WALL CLOCK. No `needs:`, so this starts at t=0 alongside `build` and
  # `devbox-validate` rather than queueing behind them. The critical path today
  # is `build` (171-206s over the last six runs) plus `ci-ok` (~3s); this job
  # installs a cached CLI, installs deps and runs a 16s suite, so it finishes
  # inside that shadow and adds NOTHING to pipeline wall time. It is concurrent,
  # not free: if `build` ever gets faster than this job, this becomes the
  # critical path. `timeout-minutes` is the cost gate the gate guard cannot
  # provide here — a hung validator fails the job, and therefore `CI OK`, in
  # minutes rather than burning the 360-minute default.
  #
  # The whole point is `CLIENT_REQUIRE_SOLANA=1`: it turns "no validator" from a
  # skip into a hard failure, so this job cannot report success having run
  # nothing. That is the exact defect swap#106 found (four suites collecting zero
  # tests, all reporting a pass) and swap#160 had to rescue.
  #
  # SCOPE. The daemon end of this seam left the repository with
  # `packages/client-mcp` in #619, which closed #608 and #616 as obsolete. What
  # is left of the seam here is the client library's own redemption path, and
  # this job covers all of it.
  solana-settlement-proof:
    name: Solana settlement redemption proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Restored BEFORE the installer so a warm cache skips the download
      # entirely. Keyed on the exact version — a version bump must miss.
      - name: Cache Solana CLI
        id: solana-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-${{ runner.os }}-v2.1.21

      # v2.1.21, NOT the v3.x line, and load-bearing rather than conservatism:
      # v3's `solana-test-validator` hard-requires io_uring, which is unavailable
      # under some sandboxed runners (connector's, swap's and toon's gates pin
      # the same version for the same reason, and connector documents the
      # `assertion failed: io_uring_supported()` panic). It also matches the
      # `=2.1.0` solana-program pin the vendored `payment_channel.so` in
      # packages/client/src/__integration__/fixtures/solana/ was built against,
      # so the CLI driving the program comes from the release line the program
      # was compiled for.
      - name: Install Solana CLI
        if: steps.solana-cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"

      - name: Put Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Fail here, with a clear message, rather than inside a test 30s later.
      # The version greps are not decoration: a cache restored from a different
      # key, or an installer that redirected to the v3 line, would otherwise
      # surface as a validator that panics on boot.
      - name: Assert Solana toolchain
        run: |
          set -euo pipefail
          solana --version
          solana-test-validator --version
          solana --version | grep -qE '^solana-cli 2\.1\.'
          solana-test-validator --version | grep -qE '^solana-test-validator 2\.1\.'
          echo "✅ Agave v2.1.x CLI and test validator on PATH"

      # --frozen-lockfile, matching `build`: this job must not be the one place
      # dependency drift hides. `devbox-validate` owns re-resolution.
      - run: pnpm install --frozen-lockfile

      # No `pnpm -r build` needed, deliberately: the suite imports the client's
      # own modules by relative source path and everything else
      # (@toon-protocol/core, @toon-protocol/sdk) from node_modules as published
      # deps. Nothing resolves through a workspace `dist/`, so there is no build
      # to pay for.
      #
      # The `Typecheck the integration suites` step used to live here. It moved to
      # the `integration` job (#607), which owns the integration directory as a
      # whole; this job stays narrowly the on-chain redemption proof.

      # CLIENT_REQUIRE_SOLANA=1 is the difference between a gate and a
      # decoration: without it, a runner whose validator failed to install would
      # skip the suite and report success. The single file is named explicitly
      # rather than running `test:integration` whole, because
      # rust-edge-devnet.integration.test.ts in the same directory defaults to a
      # LIVE devnet endpoint (it self-skips without credentials, but CI has no
      # business loading that gun) and the loopback suites belong to the
      # `integration` job, which needs no validator.
      - name: Redeem a claim against the real program on a local validator
        env:
          CLIENT_REQUIRE_SOLANA: '1'
          # Vitest colorizes when it thinks a terminal is watching, and on a
          # runner it does. That wraps its summary markers in ANSI escapes —
          # `✓<ESC>[39m src/…` and `(<ESC>[2m7 tests<ESC>[22m)` — which defeats
          # the count grep below; swap#162 shipped a guard that reported "did not
          # appear at all" for suites that had visibly just passed. Turning
          # colour off at the source keeps the log greppable AND readable; the
          # next step strips ANSI anyway, belt and braces, in case a future
          # vitest ignores these.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -euo pipefail
          pnpm --filter @toon-protocol/client test:integration \
            src/__integration__/solana-channel-lifecycle.integration.test.ts 2>&1 \
            | tee /tmp/solana-proof.log

      # A green tick is not evidence that anything ran. Three independent
      # assertions, because each catches a different way this job could pass
      # while proving nothing:
      #
      #  1. the file line's collected count — a suite that quietly loses or
      #     skips a test. Matched on the PATH, not the ✓ glyph, so a failing
      #     suite is still FOUND and reports its real count rather than "did not
      #     appear at all". `(7 tests)` with no ` | N skipped` suffix is the
      #     assertion that none were skipped.
      #  2. `Tests 7 passed (7)` — collected is not the same as passed.
      #  3. the `[solana-settle] tx …` line the redemption prints — the only
      #     line that can only exist if a transaction actually landed and moved
      #     a channel account on chain.
      #
      # Bumping EXPECTED_TESTS is meant to be a visible diff: adding a test to
      # the proof turns this red until the number moves with it.
      - name: Assert the proof collected, ran, and redeemed on chain
        env:
          EXPECTED_TESTS: '7'
          SUITE: src/__integration__/solana-channel-lifecycle.integration.test.ts
        run: |
          set -euo pipefail
          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/solana-proof.log > /tmp/solana-proof.plain
          fail=0

          line=$(grep -E "${SUITE} +\(" /tmp/solana-proof.plain | tail -1 || true)
          if [ -z "$line" ]; then
            echo "::error::${SUITE} did not appear in the vitest output at all"
            fail=1
          else
            echo "  ${line}"
            if ! echo "$line" | grep -qE "\(${EXPECTED_TESTS} tests\)"; then
              echo "::error::${SUITE} did not report exactly ${EXPECTED_TESTS} collected tests with none skipped — see the line above"
              fail=1
            fi
          fi

          if ! grep -qE "Tests +${EXPECTED_TESTS} passed \(${EXPECTED_TESTS}\)" /tmp/solana-proof.plain; then
            echo "::error::vitest did not report ${EXPECTED_TESTS} passed of ${EXPECTED_TESTS} — a collected test that did not pass is the failure this job exists to catch"
            grep -E "^ *Tests " /tmp/solana-proof.plain || true
            fail=1
          fi

          if ! grep -q '\[solana-settle\] tx ' /tmp/solana-proof.plain; then
            echo "::error::no on-chain redemption was logged — the suite passed without moving a channel account"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          grep '\[solana-settle\]' /tmp/solana-proof.plain
          echo "✅ the Solana redemption proof collected ${EXPECTED_TESTS}, passed ${EXPECTED_TESTS}, and redeemed on chain"

  # ---------------------------------------------------------------------------
  # The integration suites that need NOTHING — toon-client#607.
  #
  # `build` runs `pnpm -r test --if-present`, which resolves to each package's
  # `test` script, i.e. its UNIT config, and every unit config excludes
  # `**/__integration__/**`. So until #610 added the Solana proof, no CI job in
  # this repo had ever run an integration test — and #607 is what that hid:
  # a suite could sit red on `main` indefinitely, because nothing ran it and
  # nothing typechecked it.
  #
  # WHAT RUNS HERE, AND WHY THESE THREE. The eight integration suites in the repo
  # divide cleanly by what they need, and only the no-infra group belongs in an
  # unconditional gate:
  #
  #   NEEDS NOTHING — run here, named explicitly:
  #     client/btp-transport            binds an ephemeral loopback `ws` server
  #     client/http-ilp-transport       binds an ephemeral loopback http.Server
  #     client/cli-entry-point          spawns the CLI through a temp symlink
  #   NEEDS INFRA — runs in `solana-settlement-proof`, which installs the CLI:
  #     client/solana-channel-lifecycle  a real `solana-test-validator`
  #   NEEDS A LIVE SERVICE OR A CREDENTIAL — deliberately NOT in CI:
  #     client/rust-edge-devnet          a funded key + a live devnet connector
  #
  # Nothing here needs anvil, a validator, or a network route off the runner. The separation is the
  # point — turning `test:integration` on WHOLESALE would have pulled the live
  # devnet and credentialled suites into every PR (they self-skip, so they would
  # have contributed a green tick and zero coverage, which is the failure mode
  # this job exists to end).
  #
  # NAMED FILES, NOT `test:integration`. The same reason the Solana job names its
  # file: `vitest.integration.config.ts` globs the whole directory, so a bare
  # `test:integration` would load `rust-edge-devnet.integration.test.ts`, which
  # defaults `RUST_EDGE_E2E_EDGE` to a real devnet URL. It self-skips without a
  # funded key, but CI has no business loading that gun. The cost is that a NEW
  # no-infra suite must be added to the list below to run — which is exactly what
  # the typecheck step's drift assertion makes visible, since the new file must
  # join `tsconfig.integration.json` in the same PR.
  #
  # WALL CLOCK. No `needs:`, so this starts at t=0 alongside `build`,
  # `devbox-validate` and the Solana proof. `build` is the critical path at
  # 171-206s; this job is checkout + install + a ~1.6s suite, so it finishes well
  # inside that shadow and adds nothing to pipeline wall time. It is not free —
  # it pays its own checkout and install in runner-minutes — but it stays out of
  # `build`'s gate-guarded timed window, which has only ~8% headroom and is the
  # one place in this pipeline where adding steps carries real risk.
  integration:
    name: Integration suites (no infra)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # --frozen-lockfile, matching `build`: this job must not be the one place
      # dependency drift hides. `devbox-validate` owns re-resolution.
      - run: pnpm install --frozen-lockfile

      # No `pnpm -r build`, same as the Solana job: the suites import the
      # client's own modules by relative source path and everything else
      # (@toon-protocol/core, @toon-protocol/sdk) from node_modules as published
      # deps, so nothing resolves through a workspace `dist/`.
      #
      # `packages/client/tsconfig.json` excludes `**/*.test.ts` repo-wide, so
      # `pnpm typecheck` reads no test file in this package. That is the OTHER
      # half of what hid #607: the 4-vs-6 argument count is a plain TS2554 that
      # `tsc` reports the instant the file is in a project.
      # `tsconfig.integration.json` puts the whole integration directory in one,
      # including the two suites this job does not execute. The `files` list is
      # hand-written, so this asserts it still matches the directory — a new
      # suite cannot join the directory unchecked, and an opt-out cannot be
      # re-introduced as a silent comment (which is how #607 was parked).
      - name: Typecheck the integration suites
        run: |
          set -euo pipefail
          cd packages/client
          listed=$(node -e "
            const { readFileSync } = require('node:fs');
            const raw = readFileSync('tsconfig.integration.json', 'utf8');
            const stripped = raw.replace(/^\s*\/\/.*$/gm, '');
            for (const f of JSON.parse(stripped).files) console.log(f);
          " | sort)
          onDisk=$(ls src/__integration__/*.integration.test.ts | sort)
          if [ "$listed" != "$onDisk" ]; then
            echo "::error::tsconfig.integration.json's files list has drifted from src/__integration__/. Listed vs on disk:"
            diff <(echo "$listed") <(echo "$onDisk") || true
            exit 1
          fi
          npx tsc -p tsconfig.integration.json
          echo "✅ every integration suite in packages/client is typechecked, with no opt-outs"

      - name: Run the no-infra integration suites
        env:
          # See the Solana job: vitest colorizes on a runner, and the ANSI
          # escapes defeat the count greps in the next step.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -euo pipefail
          pnpm --filter @toon-protocol/client test:integration \
            src/__integration__/btp-transport.integration.test.ts \
            src/__integration__/cli-entry-point.integration.test.ts \
            src/__integration__/http-ilp-transport.integration.test.ts 2>&1 \
            | tee /tmp/integration.log

      # A green tick is not evidence that anything ran — the exact defect #607
      # records (a suite that passes by not running). Per-suite collected counts
      # AND a total passed count, so neither a vanished suite nor a silently
      # skipped test inside one can hide. Bumping a number is meant to be a
      # visible diff.
      - name: Assert every suite collected and passed
        env:
          # Per-suite counts and a total, so neither a vanished suite nor a
          # silently skipped test inside one can hide behind a green tick.
          BTP_TESTS: '6'
          CLI_ENTRY_TESTS: '3'
          HTTP_TESTS: '6'
          EXPECTED_TOTAL: '15'
        run: |
          set -euo pipefail
          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/integration.log > /tmp/integration.plain
          fail=0

          assert_suite() {
            suite="$1"; expected="$2"
            line=$(grep -E "${suite} +\(" /tmp/integration.plain | tail -1 || true)
            if [ -z "$line" ]; then
              echo "::error::${suite} did not appear in the vitest output at all"
              fail=1
              return
            fi
            echo "  ${line}"
            # `(N tests)` with no ` | N skipped` suffix asserts none were skipped.
            if ! echo "$line" | grep -qE "\(${expected} tests\)"; then
              echo "::error::${suite} did not report exactly ${expected} collected tests with none skipped — see the line above"
              fail=1
            fi
          }

          assert_suite src/__integration__/btp-transport.integration.test.ts "$BTP_TESTS"
          assert_suite src/__integration__/cli-entry-point.integration.test.ts "$CLI_ENTRY_TESTS"
          assert_suite src/__integration__/http-ilp-transport.integration.test.ts "$HTTP_TESTS"

          if ! grep -qE "Tests +${EXPECTED_TOTAL} passed \(${EXPECTED_TOTAL}\)" /tmp/integration.plain; then
            echo "::error::vitest did not report ${EXPECTED_TOTAL} passed of ${EXPECTED_TOTAL} — collected is not the same as passed"
            grep -E "^ *Tests " /tmp/integration.plain || true
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "✅ every no-infra integration suite collected and passed (${EXPECTED_TOTAL} tests)"

  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408). connector#1008 merged green, closed its
  # ticket and changed zero files -- and it was a human who merged it, because
  # a red NON-required check is only a warning on the merge button. This
  # replaces the stand-alone empty-pr-guard-shim.yml, deleted in the same
  # commit; running both would put two identical "No-op merge guard" check
  # runs on every PR. Canonical caller snippet and full rationale:
  # toon-meta scripts/factory/empty-pr-guard-gate-job.yml.
  #
  # No `secrets: inherit` -- the guard makes no API call and no write of any
  # kind, so handing it FACTORY_OPS_TOKEN would widen a monitored credential
  # for nothing. No `if:` either: this workflow also runs on push, where the
  # guard passes with a plain "no merge result to evaluate"; a job-level `if:`
  # would make it `skipped` there, and a skipped gating job must never read as
  # a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  # Fleet-wide aggregate required check per toon-meta#279. This job is the
  # single check that branch protection requires. `if: always()` makes it run
  # even when upstream jobs fail, are skipped, or are cancelled — a skipped or
  # cancelled gating job must never read as a pass. `changeset` is skipped BY
  # DESIGN on push events only; on pull_request it must succeed.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      [
        changeset,
        build,
        devbox-validate,
        solana-settlement-proof,
        integration,
        no-op-merge,
      ]
    if: always()
    steps:
      - name: Verify all gating jobs succeeded
        env:
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEVBOX_RESULT: ${{ needs.devbox-validate.result }}
          SOLANA_PROOF_RESULT: ${{ needs.solana-settlement-proof.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          NO_OP_MERGE_RESULT: ${{ needs.no-op-merge.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event:           $EVENT_NAME"
          echo "changeset:       $CHANGESET_RESULT"
          echo "build:           $BUILD_RESULT"
          echo "devbox-validate: $DEVBOX_RESULT"
          echo "solana-proof:    $SOLANA_PROOF_RESULT"
          echo "integration:     $INTEGRATION_RESULT"
          echo "no-op-merge:     $NO_OP_MERGE_RESULT"

          ok=true

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::build result is '$BUILD_RESULT' (expected 'success')"
            ok=false
          fi

          if [ "$DEVBOX_RESULT" != "success" ]; then
            echo "::error::devbox-validate result is '$DEVBOX_RESULT' (expected 'success')"
            ok=false
          fi

          # The Solana redemption proof is UNCONDITIONAL (see the job for why),
          # which is what makes a bare `needs:` a complete gate here: it has no
          # `if:` of its own, so 'skipped' cannot mean "correctly not required" —
          # it can only mean cancelled-upstream or a workflow edit that stopped
          # it running, and both must fail. That is the toon#216 hazard closed by
          # construction instead of by pairing a result with a decision.
          if [ "$SOLANA_PROOF_RESULT" != "success" ]; then
            echo "::error::solana-settlement-proof result is '$SOLANA_PROOF_RESULT' (expected 'success'; skipped/cancelled counts as failure — this job has no 'if:', so a skip means it stopped running, not that it was unnecessary)"
            ok=false
          fi

          # Same construction as the Solana proof: the `integration` job carries
          # no `if:`, so 'skipped' cannot mean "legitimately not required" — only
          # cancelled-upstream or a workflow edit that stopped it running. #607 is
          # exactly the failure of a suite that passes by not running, so a
          # not-run integration job must never read as a pass.
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::integration result is '$INTEGRATION_RESULT' (expected 'success'; skipped/cancelled counts as failure — this job has no 'if:', so a skip means it stopped running)"
            ok=false
          fi

          # The no-op merge guard runs on every event and passes on push with
          # "no merge result to evaluate", so it is unconditional here.
          if [ "$NO_OP_MERGE_RESULT" != "success" ]; then
            echo "::error::no-op merge guard result is '$NO_OP_MERGE_RESULT' (expected 'success') — merging this PR would change nothing"
            ok=false
          fi

          # changeset only runs on pull_request; on push events 'skipped' is
          # the expected, legitimate result. Failure/cancelled always fail.
          case "$CHANGESET_RESULT" in
            success) ;;
            skipped)
              if [ "$EVENT_NAME" != "push" ]; then
                echo "::error::changeset was skipped on a '$EVENT_NAME' event (only legitimate on push)"
                ok=false
              fi
              ;;
            *)
              echo "::error::changeset result is '$CHANGESET_RESULT' (expected 'success', or 'skipped' on push)"
              ok=false
              ;;
          esac

          if [ "$ok" != "true" ]; then
            exit 1
          fi
          echo "All gating jobs green — CI OK"
